<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disco Zoo — sprite comparison</title>
<style>
body{margin:0;padding:24px;background:#0b1014;color:#e5e8df;font:15px system-ui,sans-serif}main{max-width:1080px;margin:auto}h1{font-size:26px}p{color:#aebbad;line-height:1.6}button{padding:12px 18px;background:#23302d;color:inherit;border:1px solid #789078;cursor:pointer}button:focus-visible{outline:2px solid #d9efad;outline-offset:3px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:16px;background:#171e24;border:1px solid #ffffff18}.sprite{min-height:112px;display:flex;align-items:center;justify-content:center;background:#171e24}.sprite img{width:128px;height:92px;image-rendering:pixelated}.light .sprite{background:#deded5}h3{font-size:13px;font-weight:500}.original{image-rendering:pixelated}h2{margin-top:36px;font-size:20px}@media(max-width:640px){.row{grid-template-columns:1fr}body{padding:18px}}
</style><main><h1>Three-sprite upscale experiment</h1><p>128 × 92 PNGs from untouched 32 × 23 sources. Production continues to use the originals. Scale2x uses exact RGBA neighbor equality; Scale4x applies it twice. No new colors, AI, or blur.</p><button id="background" aria-pressed="false">Light background</button><div id="comparisons"></div><p><a style="color:#d9efad" href="comparison.png">Open contact sheet</a> · <a style="color:#d9efad" href="metrics.json">Verification metrics</a></p></main>
<script>
const subjects=['kangaroo','koala','cockatoo'];const methods=[['nearest-4x','Nearest neighbor 4×'],['scale2x-nearest-4x','Scale2x + nearest 2×'],['scale4x','Scale4x (two Scale2x passes)']];
document.querySelector('#comparisons').innerHTML=subjects.map(subject=>`<section><h2>${subject[0].toUpperCase()+subject.slice(1)} <img class="original" src="../../animals/outback/${subject}.png" width="32" height="23" alt="Original ${subject}"></h2><div class="row">${methods.map(([method,label])=>`<div class="card"><h3>${label}</h3><div class="sprite"><img src="${subject}-${method}.png" width="128" height="92" alt="${subject}: ${label}"></div></div>`).join('')}</div></section>`).join('');
document.querySelector('#background').onclick=function(){const light=document.body.classList.toggle('light');this.setAttribute('aria-pressed',String(light));this.textContent=light?'Dark background':'Light background';};
</script></html>
