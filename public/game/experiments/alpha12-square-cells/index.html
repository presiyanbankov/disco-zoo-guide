<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALPHA 12 square-cell review</title>
<style>body{background:#090d0b;color:#dce4df;font:16px system-ui;margin:24px}section{display:flex;gap:16px;overflow:auto;margin-bottom:40px}figure{margin:0;flex:0 0 320px}img{width:100%;height:auto}figcaption{margin-bottom:10px}a{color:#bcb7dc}</style>
<h1>Rescue board containment</h1><p>Active, complete and contradiction boards. Original image proportions retained.</p><p><a href="results.json">Measured geometry</a></p><main></main>
<script>for(const width of [375,390,768,1440]){const h=document.createElement('h2');h.textContent=width+'px';document.querySelector('main').append(h);for(const animal of ['jade-rabbit','sasquatch','giraffe']){const section=document.createElement('section');for(const state of ['active','complete','contradiction']){const figure=document.createElement('figure');const caption=document.createElement('figcaption');caption.textContent=animal+' / '+state;const image=document.createElement('img');image.src=animal+'-'+state+'-'+width+'.png';image.alt=caption.textContent+' at '+width+'px';image.loading='lazy';figure.append(caption,image);section.append(figure);}document.querySelector('main').append(section);}}</script></html>
